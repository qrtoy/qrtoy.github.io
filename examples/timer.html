<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>Timer</title>
<style>
  body {
    position: fixed;
    inset: 0;
    margin: 0;
    background: #111;
    color: #eee;
    font:
      18px system-ui,
      sans-serif;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 24px;
    user-select: none;
    -webkit-user-select: none;
  }
  #r {
    width: min(84vw, 60vh);
    aspect-ratio: 1;
    border-radius: 50%;
    display: grid;
    place-items: center;
  }
  #r div {
    width: 90%;
    height: 90%;
    border-radius: 50%;
    background: #111;
    display: grid;
    place-content: center;
    text-align: center;
    color: #888;
  }
  #d {
    font:
      min(16vw, 12vh) ui-monospace,
      monospace;
    color: #eee;
  }
  p {
    margin: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  button {
    font: inherit;
    border: 0;
    border-radius: 20px;
    padding: 8px 14px;
    background: #333;
    color: inherit;
  }
</style>
<div id="r">
  <div><span id="d"></span><span id="s"></span></div>
</div>
<p id="p"></p>
<script>
  // All times are in milliseconds. While running, `end` is when the timer hits zero;
  // while paused, `end` is 0 and `left` is the time remaining.
  let total,
    left,
    end = 0,
    ringing = 0,
    lastBeep = 0,
    A = new AudioContext();

  function set(min) {
    total = left = min * 60e3;
    end = ringing = 0;
  }

  function beep(delay) {
    let osc = new OscillatorNode(A, { frequency: 880 }),
      t = A.currentTime + delay;
    osc.connect(new GainNode(A, { gain: 0.3 })).connect(A.destination);
    osc.start(t);
    osc.stop(t + 0.1);
  }

  [1, 3, 5, 10, 15, 25].forEach((min) => {
    let b = document.createElement("button");
    b.textContent = min + " min";
    b.onclick = () => set(min);
    p.append(b);
  });
  let more = document.createElement("button");
  more.textContent = "+1";
  more.onclick = () => {
    total += 60e3;
    end ? (end += 60e3) : (left += 60e3);
    ringing = 0;
  };
  p.append(more);

  r.onclick = () => {
    A.resume();
    if (ringing || !left) set(total / 60e3);
    else if (end) ((left = end - Date.now()), (end = 0));
    else end = Date.now() + left;
  };

  // An interval rather than requestAnimationFrame, so the alarm still goes off in a background tab.
  // When time is up it rings until tapped: three quick beeps every second.
  setInterval(() => {
    let now = Date.now(),
      ms = end ? end - now : left;
    if (end && ms <= 0) {
      ms = left = end = 0;
      ringing = 1;
      navigator.vibrate?.([200, 100, 200]);
    }
    if (ringing && now - lastBeep > 1000) {
      lastBeep = now;
      [0, 0.15, 0.3].forEach(beep);
    }
    let sec = Math.ceil(ms / 1000);
    d.textContent = ((sec / 60) | 0) + ":" + String(sec % 60).padStart(2, "0");
    s.textContent = ringing
      ? "tap to stop"
      : end
        ? "tap to pause"
        : left < total
          ? "paused"
          : "tap to start";
    r.style.background = `conic-gradient(${ringing ? "#e44" : "#f93"} ${ringing ? +(now % 1000 < 500) : ms / total}turn, #333 0)`;
  }, 100);
  set(5);
</script>
