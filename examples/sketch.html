<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>Sketch</title>
<style>
  body {
    position: fixed;
    inset: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    background: #fff;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    flex: 1;
    min-height: 0;
  }
  p {
    margin: 0;
    padding: 8px;
    display: flex;
    gap: 8px;
    background: #eee;
  }
  button {
    flex: 1;
    height: 40px;
    border: 2px solid #ccc;
    border-radius: 20px;
    font:
      16px system-ui,
      sans-serif;
    color: #000;
  }
  .on {
    border-color: #000;
  }
</style>
<canvas id="c"></canvas>
<p id="p"></p>
<script>
  // The canvas is sized in device pixels for sharp lines, but drawn on in CSS pixels.
  let dpr = devicePixelRatio,
    ctx = c.getContext("2d"),
    color = "#222",
    size = 4,
    last; // previous point of the current stroke, undefined between strokes

  function clear() {
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.scale(dpr, dpr);
    ctx.lineCap = ctx.lineJoin = "round";
  }

  function line(e) {
    ctx.strokeStyle = color;
    // Pens draw thicker the harder you press. White paints over lines, so it doubles as an eraser.
    ctx.lineWidth =
      size * (e.pointerType == "pen" ? e.pressure * 2 : 1) * (color == "#fff" ? 4 : 1);
    ctx.beginPath();
    ctx.moveTo(...last);
    ctx.lineTo(e.clientX, e.clientY);
    ctx.stroke();
    last = [e.clientX, e.clientY];
  }

  c.onpointerdown = (e) => {
    c.setPointerCapture(e.pointerId);
    last = [e.clientX, e.clientY];
    line(e);
  };
  // Coalesced events are the extra points fast strokes produce between animation frames.
  c.onpointermove = (e) => last && (e.getCoalescedEvents?.() || [e]).forEach(line);
  c.onpointerup = () => (last = undefined);

  function button(text, onclick) {
    let b = document.createElement("button");
    b.textContent = text;
    b.onclick = () => onclick(b);
    p.append(b);
    return b;
  }
  ["#222", "#e33", "#f90", "#2b4", "#36e", "#a3c", "#fff"].forEach((col, i) => {
    let b = button("", () => {
      color = col;
      p.querySelector(".on").className = "";
      b.className = "on";
    });
    b.style.background = col;
    b.className = i ? "" : "on";
  });
  button(size, (b) => (b.textContent = size = size > 8 ? 2 : size * 2));
  button("clear", () => (ctx.resetTransform(), clear()));

  // qrtoy can run this before the page around it is laid out, while the canvas is still 0x0,
  // so wait for a real size.
  function start() {
    if (!c.clientWidth) return requestAnimationFrame(start);
    c.width = c.clientWidth * dpr;
    c.height = c.clientHeight * dpr;
    clear();
  }
  start();
</script>
